<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f2f2f2;
            color: #222222;
            font-family: sans-serif;
            margin: 0;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        #summary {
            margin-top: 4px;
            margin-bottom: 24px;
            color: #555555;
        }

        .habit {
            background-color: white;
            border: 2px solid #222222;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .habit.complete {
            background-color: #fff8d6;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .habit h2 {
            margin: 0;
            font-size: 18px;
        }

        .streak {
            font-size: 14px;
            color: #555555;
        }

        label {
            display: block;
            padding: 3px 0;
            cursor: pointer;
        }

        .bar {
            height: 10px;
            border: 2px solid #222222;
            margin-top: 12px;
            margin-bottom: 10px;
        }

        .bar div {
            height: 100%;
            background-color: #ffd23f;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .week {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #222222;
        }

        .dot.on {
            background-color: #222222;
        }

        .remove {
            background: none;
            border: none;
            color: #aa3333;
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        form {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 2px solid #222222;
        }

        form h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        form input {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 2px solid #222222;
            font-size: 16px;
        }

        form button {
            padding: 8px 16px;
            background-color: #ffd23f;
            border: 2px solid #222222;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1 id="date"></h1>
        <p id="summary"></p>

        <div id="habits"></div>

        <form id="add-form">
            <h2>Add a habit</h2>
            <input id="name" type="text" placeholder="Habit name (e.g. Morning workout)" required>
            <input id="checkpoints" type="text"
                placeholder="Checkpoints, separated by commas (e.g. warm up, main set, stretch)">
            <button>Add habit</button>
        </form>
    </main>


    <script>

        var habits = [];
        var today = new Date().toDateString();

        var saved = localStorage.getItem("habits");
        if (saved !== null) {
            habits = JSON.parse(saved);
        }

        function resetIfNewDay() {
            var savedDay = localStorage.getItem("day");

            if (savedDay !== today) {
                for (var i = 0; i < habits.length; i++) {
                    for (var j = 0; j < habits[i].checkpoints.length; j++) {
                        habits[i].checkpoints[j].done = false;
                    }
                }
                localStorage.setItem("day", today);
            }
        }

        function save() {
            localStorage.setItem("habits", JSON.stringify(habits));
        }

        function clean(text) {
            return text.split("<").join("&lt;");
        }

        function wasDone(habit, day) {
            for (var i = 0; i < habit.doneDays.length; i++) {
                if (habit.doneDays[i] === day) {
                    return true;
                }
            }
            return false;
        }

        function getStreak(habit) {
            var count = 0;
            var day = new Date();

            if (wasDone(habit, day.toDateString()) === false) {
                day.setDate(day.getDate() - 1);
            }

            while (wasDone(habit, day.toDateString()) === true) {
                count = count + 1;
                day.setDate(day.getDate() - 1);
            }

            return count;
        }

        function tick(habitIndex, checkpointIndex) {
            var habit = habits[habitIndex];
            var checkpoint = habit.checkpoints[checkpointIndex];

            if (checkpoint.done === true) {
                checkpoint.done = false;
            } else {
                checkpoint.done = true;
            }

            var allDone = true;
            for (var i = 0; i < habit.checkpoints.length; i++) {
                if (habit.checkpoints[i].done === false) {
                    allDone = false;
                }
            }

            var position = habit.doneDays.indexOf(today);

            if (allDone === true && position === -1) {
                habit.doneDays.push(today);
            }
            if (allDone === false && position !== -1) {
                habit.doneDays.splice(position, 1);
            }

            save();
            show();
        }

        function removeHabit(index) {
            var sure = confirm("Delete " + habits[index].name + "?");

            if (sure === true) {
                habits.splice(index, 1);
                save();
                show();
            }
        }

        function addHabit(event) {
            event.preventDefault();

            var name = document.getElementById("name").value.trim();
            var text = document.getElementById("checkpoints").value;
            var parts = text.split(",");

            var checkpoints = [];
            for (var i = 0; i < parts.length; i++) {
                var part = parts[i].trim();
                if (part !== "") {
                    checkpoints.push({ text: part, done: false });
                }
            }

            if (checkpoints.length === 0) {
                checkpoints.push({ text: "Done", done: false });
            }

            habits.push({ name: name, checkpoints: checkpoints, doneDays: [] });

            save();
            document.getElementById("add-form").reset();
            show();
        }

        function show() {
            var box = document.getElementById("habits");
            box.innerHTML = "";
            var finished = 0;

            if (habits.length === 0) {
                box.innerHTML = "<p>No habits yet. Add your first one below.</p>";
            }

            for (var h = 0; h < habits.length; h++) {
                var habit = habits[h];
                var total = habit.checkpoints.length;

                var done = 0;
                for (var i = 0; i < total; i++) {
                    if (habit.checkpoints[i].done === true) {
                        done = done + 1;
                    }
                }

                var percent = Math.round((done / total) * 100);

                var boxClass = "habit";
                if (done === total) {
                    finished = finished + 1;
                    boxClass = "habit complete";
                }

                var checks = "";
                for (var j = 0; j < total; j++) {
                    var checkpoint = habit.checkpoints[j];

                    var checkedText = "";
                    if (checkpoint.done === true) {
                        checkedText = "checked";
                    }

                    checks = checks + "<label>";
                    checks = checks + "<input type='checkbox' " + checkedText + " onchange='tick(" + h + "," + j + ")'>";
                    checks = checks + clean(checkpoint.text);
                    checks = checks + "</label>";
                }

                var week = "";
                for (var k = 6; k >= 0; k = k - 1) {
                    var date = new Date();
                    date.setDate(date.getDate() - k);

                    var dotClass = "dot";
                    if (wasDone(habit, date.toDateString()) === true) {
                        dotClass = "dot on";
                    }

                    week = week + "<span class='" + dotClass + "' title='" + date.toDateString() + "'></span>";
                }

                var streak = getStreak(habit);
                var streakText = "";
                if (streak === 0) {
                    streakText = "no streak yet";
                } else if (streak === 1) {
                    streakText = "1 day in a row";
                } else {
                    streakText = streak + " days in a row";
                }

                var html = "<div class='" + boxClass + "'>";
                html = html + "<div class='top'>";
                html = html + "<h2>" + clean(habit.name) + "</h2>";
                html = html + "<span class='streak'>" + streakText + "</span>";
                html = html + "</div>";
                html = html + checks;
                html = html + "<div class='bar'><div style='width:" + percent + "%'></div></div>";
                html = html + "<div class='bottom'>";
                html = html + "<div class='week'>" + week + "</div>";
                html = html + "<button class='remove' onclick='removeHabit(" + h + ")'>Delete</button>";
                html = html + "</div>";
                html = html + "</div>";

                box.innerHTML = box.innerHTML + html;
            }

            var summary = document.getElementById("summary");
            if (habits.length === 0) {
                summary.textContent = "";
            } else {
                summary.textContent = finished + " of " + habits.length + " habits done today";
            }
        }

        document.getElementById("add-form").addEventListener("submit", addHabit);

        document.getElementById("date").textContent =
            new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });

        resetIfNewDay();
        show();
    </script>

</body>

</html>
